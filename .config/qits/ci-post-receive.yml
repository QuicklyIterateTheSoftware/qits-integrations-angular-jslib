# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# TWO STEPS, AND THE SPLIT IS THE POINT: the first checks every push, the second publishes and runs
# on `main` alone. `-main.g<sha7>` names a branch, so it may only ever be cut from that branch — a
# task-branch publish would produce a tarball whose identifier says `main` from a commit that was
# never on it. `branches:` is the key that binds it, and its absence on the check step is what keeps
# every other branch linted, tested and built exactly as before.
#
# THE COST IS ONE EXTRA INSTALL AND BUILD ON EVERY `main` PUSH. No state crosses steps — each one
# gets a fresh container and its own clone — so the publish step has to produce `dist/` itself.
#
# Neither step declares `docker: true`: `npm publish` needs no docker socket, no host daemon and no
# root-equivalence — only HTTP from this step's container to qits-platform-artifacts over qits-net, which
# every step already has. So both keep the full sandbox (--cap-drop=ALL, no-new-privileges,
# resource caps).
#
# The published artifact is `dist/qits-integrations-angular`, the ng-packagr output — NOT the repo
# root. The root package.json is the workspace harness and keeps `private: true`;
# projects/qits-integrations-angular/package.json is the single source of truth for name and
# version, and ng-packagr generates the published manifest from it.
#
# Two env vars are injected into every step container by qits-ci, so no registry address is spelled
# in this repo: $QITS_NPM_PROXY_URL (the pull-through cache of npmjs) and $QITS_NPM_REGISTRY_URL
# (the hosted repository the @qits scope publishes to). Both are qits-net aliases dialled by this
# container itself, never by the host's docker daemon — the opposite of $QITS_REGISTRY's caveat.
#
# THIS PIPELINE PUBLISHES PRERELEASES ONLY. The release itself belongs to ci-event-release.yml,
# which reacts to this repository's release TAG, checks it out and publishes the real version.
# What a push to main produces is `<last released version>-main.g<sha7>` — the last released version
# as the base, so the prerelease sorts just under the release it follows and above everything older.
steps:
    # EVERY BRANCH, no `branches:` key.
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so an unguarded failure would be swallowed
      # by the next command's exit code. -u is load-bearing too: with the registry vars unset, an
      # unset-tolerant script writes a registry-less .npmrc and then resolves the @qits scope
      # against npmjs.org, where these packages do not exist and never will.
      set -eu

      # The third line is npm-CLI ceremony and nothing else: the CLI refuses to publish when no
      # credential is configured for the target registry, a pre-flight that never reaches the wire.
      # qits-platform-artifacts requires and reads no credential. The parameter expansion strips the scheme,
      # leaving the //host/path/ form npm keys credentials by — the one non-obvious line here.
      cat > ~/.npmrc <<EOF
      registry=${QITS_NPM_PROXY_URL}
      @qits:registry=${QITS_NPM_REGISTRY_URL}
      ${QITS_NPM_REGISTRY_URL#http:}:_authToken=qits-ci
      EOF

      pnpm install --frozen-lockfile
      pnpm lint

      # The jsdom target. The *.browser.spec.ts suite (`pnpm test:browser`) needs a real layout
      # engine, hence a chromium download and its system libraries — deliberately not in this
      # pipeline; it runs locally, where the one-time `playwright install chromium` has been paid.
      pnpm test

      pnpm build

    # MAIN ONLY.
    #
    # It runs after the checks above, in the same run, on the same push. That ordering IS the "only
    # publish if the tests passed" rule — a failing step stops the loop, so this one is simply never
    # reached. On every other branch it is recorded SKIPPED and changes nothing.
    #
    # `--tag main` IS MANDATORY, NOT TIDINESS. A bare `npm publish` means `--tag latest`, and the
    # registry refuses any publish that would move `latest` to a lower-sorting version — a
    # prerelease sorts below its release, so it refuses the whole publish with a 403. That rule is
    # the guard; this flag is how the pipeline stays on the right side of it.
    #
    # THE `g` IS LOAD-BEARING. It keeps the identifier alphanumeric, which is what stops semver's
    # leading-zero rule from ever firing on an all-digit sha. Without it, one sha in sixteen would
    # make the version string invalid and the publish would fail for a reason nobody could see in
    # the diff.
    #
    # The version is set on the BUILT manifest under dist/, never in the tree: nothing is committed,
    # the release gate stays the version in projects/qits-integrations-angular/package.json, and
    # `check-exports` still compares dist against that untouched source.
    #
    # Publish-if-absent survives all of it: a re-run of the same sha computes the same version,
    # finds it in the registry and succeeds without touching it. Versions are immutable, so this
    # never fights the registry.
  - image: qits/build-images/node-base:latest
    branches:
      - exact: main
    timeout-seconds: 1800
    script: |
      set -eu

      # DEFENCE IN DEPTH against an older or rolled-back qits-ci. An engine that does not know the
      # `branches:` key above ignores it and runs this step on EVERY push, which would cut a
      # prerelease named `main` off a branch that is not. Free when the filter works, and a loud red
      # step instead of a mislabelled tarball when it does not. The same guard qits-spa-home's
      # maintenance leg carries.
      if [ "$QITS_CI_BRANCH" != "main" ]; then
        echo "not main: $QITS_CI_BRANCH"
        exit 1
      fi

      cat > ~/.npmrc <<EOF
      registry=${QITS_NPM_PROXY_URL}
      @qits:registry=${QITS_NPM_REGISTRY_URL}
      ${QITS_NPM_REGISTRY_URL#http:}:_authToken=qits-ci
      EOF

      base=$(node -p "require('./projects/qits-integrations-angular/package.json').version")
      ver="$base-main.g${QITS_CI_SHA:0:7}"
      if npm view "@qits/angular@$ver" version >/dev/null 2>&1; then
        echo "@qits/angular@$ver is already published — skipping"
        exit 0
      fi

      # The step's own dist/, because no state crosses steps. Lint and tests are the first step's
      # job and are not repeated: this build exists to produce the tarball, and a second opinion on
      # a tree that just passed would only cost minutes.
      pnpm install --frozen-lockfile
      pnpm build

      echo "publishing @qits/angular@$ver"
      (cd ./dist/qits-integrations-angular && npm version "$ver" --no-git-tag-version)
      npm publish ./dist/qits-integrations-angular --tag main
